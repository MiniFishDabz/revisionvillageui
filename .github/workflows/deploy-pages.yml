name: Sync upstream and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_BASE: https://git.pirateib.sh
  UPSTREAM_OWNER: pirateIB
  UPSTREAM_NAME: village
  UPSTREAM_REF: master
  UPSTREAM_REPO: https://git.pirateib.sh/pirateIB/village

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download latest Village source through Gitea API
        run: node scripts/sync-upstream.mjs

      - name: Verify upstream files are real LFS contents
        run: |
          test -f .upstream/src/index.html
          test -f .upstream/src/main.js
          if head -n 1 .upstream/src/main.js | grep -q 'git-lfs.github.com/spec/v1'; then
            echo 'main.js is still an LFS pointer; refusing to deploy a broken site.'
            exit 1
          fi

      - name: Build premium site without modifying question data
        run: node scripts/build-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
